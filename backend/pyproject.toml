[project]
name = "mira-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "bcrypt>=4.0.1,<4.1",
  "cryptography>=42.0.0",
  "docker>=7.1.0",
  "passlib[bcrypt]>=1.7.4",
  "jsonschema>=4.23.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "tomli-w>=1.0.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
